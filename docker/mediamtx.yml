# กล้องจำลอง: เล่นวิดีโอวนผ่าน RTSP เหมือนกล้อง IP จริง → rtsp://camsim:8554/cam1
# (วางไฟล์ไว้ที่ data/samples/live.mp4 — บน Mac: make remote-sample)
logLevel: warn
rtsp: yes
rtspAddress: :8554
rtmp: no
# ภาพสดที่วาดกรอบแล้ว: backend ส่ง H.264 เข้ามาที่ path annot<id> แล้วเบราว์เซอร์เล่นแบบ LL-HLS (พอร์ต 8888) — ดู backend/app/hls.py
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins: ['*']
webrtc: no
srt: no
paths:
  all_others:
  cam1:
    runOnInit: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i /samples/live.mp4 -c copy -f rtsp -rtsp_transport tcp rtsp://localhost:8554/cam1
    runOnInitRestart: yes
