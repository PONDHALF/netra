# ติดตั้งและรัน:  docker compose up --build   → เปิด http://localhost:8000
services:
  netra:
    build: .
    image: netra:phase1
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data                    # วิดีโอ ผลลัพธ์ ฐานข้อมูล (เปิดดูจาก Windows ได้)
      - ./engine/models:/app/engine/models  # yolo11s.pt, plate.pt, plate_ocr.pt
      - netra-cache:/cache                  # cache โมเดล (Typhoon 7.5 GB, EasyOCR) — อยู่ใน Docker จึงโหลดเร็ว
    environment:
      - NETRA_DEVICE=${NETRA_DEVICE:-}      # เว้นว่าง = เลือกอัตโนมัติ (cuda > cpu)
      - NETRA_TYPHOON=${NETRA_TYPHOON:-0}   # 1 = ใช้ Typhoon OCR 3B ช่วยอ่านจังหวัด (แรม ~8 GB)
      - NETRA_HLS_RTSP=${NETRA_HLS_RTSP:-rtsp://camsim:8554}  # ภาพสดแบบวิดีโอ (LL-HLS) ผ่าน MediaMTX — เว้นว่างเพื่อใช้ MJPEG อย่างเดียว
      - NETRA_DEMO_CAMERA=${NETRA_DEMO_CAMERA:-rtsp://camsim:8554/cam1}  # สร้างกล้องจำลองให้ ถ้ายังไม่มีกล้อง
    restart: unless-stopped

  # กล้องจำลอง (RTSP) — เล่น data/samples/live.mp4 วน ใช้ทดสอบระหว่างยังไม่มีกล้องจริง
  camsim:
    image: bluenviron/mediamtx:latest-ffmpeg
    ports:
      - "8888:8888"                        # LL-HLS ของภาพสดที่วาดกรอบแล้ว
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
      - ./data/samples:/samples:ro
    restart: unless-stopped

  # เทรนโมเดลอ่านป้าย (PlateNet) — ใช้ image เดียวกับระบบ, mount โค้ดทั้งโปรเจกต์ จึงไม่ต้อง build ใหม่เมื่อแก้สคริปต์เทรน
  # เริ่มจาก Mac: make remote-train  (ไม่ได้รันตอน docker compose up ปกติ เพราะอยู่ใน profile "train")
  trainer:
    image: netra:phase1
    profiles: ["train"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - netra-cache:/cache
    shm_size: "8gb"              # DataLoader หลาย worker ส่งภาพผ่าน shared memory (ค่าเริ่มต้น 64 MB ไม่พอ)
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=1        # กัน thread ล้น: หลาย worker × thread เท่าจำนวน core
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1

volumes:
  netra-cache:
